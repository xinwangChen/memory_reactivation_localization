# Fair launch pair (Transformer half): train/data/plots match target_pitch_cnn_launch.yaml;
# Block CV within each Exp1 subject; override fold with --cv-fold 0..4.
cv_fold: 0
cv_folds: 5
cv_split_dir: ../artifacts/cv5
# only model.encoder differs. Same confidence notes as the CNN launch file.
# R1-7 had no window_transformer runs — structure is reasonable default, not validated by those sweeps.

seed: 20260530
run:
  base_output_dir: ../runs/target_pitch_transformer_launch
  base_experiment_name: pitch-transformer_v2-window5

swanlab:
  enabled: true
  mode: cloud
  project: pb2023-eeg-deep-pitch-v5
  base_tags: [pb2023, eeg, exp1-only, launch-v1, window-transformer]

preprocessing:
  graph_laplacian:
    enabled: false
    n_neighbors: 6

data:
  manifest_csv: ../artifacts/manifest.csv
  split_csv: ../artifacts/block_splits.csv
  normalization_json: ../artifacts/normalization.json
  experiments: [1]
  lags: [0]
  require_clean_history: false
  balance_train_cells: true
  balance_eval_cells: false
  batch_sampling: global
  cache_size: 30
  time_window_start_s: -0.496
  time_window_end_s: 2.244
  num_workers: 0

model:
  encoder:
    type: window_transformer
    in_channels: 64
    latent_dim: 24
    num_layers: 1
    # right_local: query t sees t..t+W-1 (trailing edge shortens; no pad)
    window_size: 5
    num_heads: 2
    ffn_ratio: 2
    dropout: 0.1
    attention_pattern: right_local
    shift_size: 0
  time_source_block:
  time_head_mode: independent_linear
  time_no_class_enabled: true
  attention_mode: gated_scorer
  attention_query_source: subject
  attention_dim: 24
  attention_dropout: 0.1
  attention_gate_init_bias: 2.0
  classifier_num_layers: 1
  classifier_hidden_dim: 48
  classifier_dropout: 0.1
  subject_conditioning:
    enabled: true
    embedding_dim: 24
    condition_dropout: 0.1
    adaln_dropout: 0.1
  fusion:
    enabled: false
    hidden_dim: 32
    dropout: 0.1

train:
  iterations: 100000
  validation_interval_iterations: 100
  log_interval_iterations: 100
  batch_size: 1024
  learning_rate: 0.0001
  lr_schedule: warmup_cosine
  warmup_iterations: 5000
  min_learning_rate: 0.000005
  weight_decay: 0.05
  loss_type: bce_one_vs_rest
  time_loss_type: bce_one_vs_rest
  pooled_loss_type: bce_one_vs_rest
  fusion_loss_type: bce_one_vs_rest
  time_bce_pos_weight: 2.0
  pooled_bce_pos_weight: 4.0
  label_smoothing: 0.0
  patience_iterations: 12000
  checkpoint_metric: val_pooled_cell_balanced_accuracy
  checkpoint_mode: max
  amp: true
  grad_clip_norm: 1.0
  progress_bar: true
  train_time_start_s: -0.496
  train_time_end_s: 2.244
  attention_time_start_s: -0.496
  attention_time_end_s: 2.244
  attention_topk_ratio: 0.30
  attention_topk_k:
  all_time_head_warmup_iterations: 1000
  time_loss_weight: 0.1
  pooled_loss_weight: 1.0
  fusion_loss_weight: 0.0
  invalid_time_loss_weight: 0.0
  invalid_time_loss_scope: topq_covered
  attention_mask_penalty_weight: 0.1
  attention_mask_penalty_mode: absolute_effective_mass
  non_topq_time_loss_probability: 0.1
  temporal_crop_noise:
    enabled: true
    geometry: random_blocks
    probability: 0.5
    min_blocks: 1
    max_blocks: 3
    min_block_duration_s: 0.03
    min_total_duration_s: 0.1
    max_total_duration_s: 1.0
    min_clean_gap_s: 0.03
    allow_edge_blocks: true
    noise_mode: sample_channel
    min_noise_std: 0.0001
    supervision_mode: all_positions

plots:
  enabled: true
  splits: [val]
  gaussian_baseline:
    enabled: true
    seed: 20260628
    noise_mode: sample_channel
  activation:
    enabled: false
    threshold: 0.5
  event_markers:
    enabled: true
    markers:
      - {time_s: 0.0, label: white-noise onset, color: "#666666", alpha: 0.70}
      - {time_s: 1.0, label: tone onset, color: "#4C78A8", alpha: 0.90}
      - {time_s: 1.25, label: tone offset / response cue, color: "#F58518", alpha: 0.90}
