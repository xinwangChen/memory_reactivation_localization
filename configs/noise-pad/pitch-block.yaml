# Noise padding provides boundary K/V only; all heads retain 275 real positions.
seed: 42
cv_fold: 0
cv_folds: 5
cv_split_dir: ../../artifacts/cv5
run:
  base_output_dir: ../../runs/noise-pad/pitch-block
  base_experiment_name: pitch-trans-e4-noise-pad-v1-block-full275-bs256-lr1e-5-augp0p8
swanlab:
  enabled: true
  mode: cloud
  project: pb2023-eeg-deep-pitch-v4
  base_tags:
  - pb2023
  - eeg
  - exp1-only
  - pitch
  - pitch-legacy-hyperparameters
  - s0-balanced
  - bs-256
  - lr-1e-5
  - time-0p1
  - mask-0p3
  - topq-0p8
  - condition-dropout-0
  - input-275
  - pooled-focal-gamma1
  - global-augmentation-p-0p8
  - hierarchical-augmentation
  - roll-prob-0p2
  - near-conditional-p-0p1
  - near-coverage-0p95
  - near-time-scale-0p25
  - replacement-shared50-gaussian25-independent25
  - time-start-minus-0p496
  - time-end-2p244
  - user-selected-lr1e-5
  - main-config
  - cv-block
  - conditioning-individual
  - attention-score-centering-v1
  - scorer-centering-enabled
  - attention-gate-exploration-v1
  - e4-tanh-plus-one-multiply
  - gate-activation-tanh_plus_one
  - gate-combination-multiply
  - gate-centering-false
  - post-softmax-combination
  - selected-common-e4-direction
  - attention-e4-noise-pad-v1
  - boundary-noise-pad
  - pad-kv-only
  - pad-standard-normal
  - pad-eval-seed42
  - attention-mass-penalty-w0p1
preprocessing:
  graph_laplacian:
    enabled: true
    mode: replace
    n_neighbors: 6
    electrodes_npz: ../../data/preprocessed/electrodes/Exp1_electrodes.npz
data:
  manifest_csv: ../../artifacts/cv5/manifest.csv
  split_csv: ../../artifacts/cv5/fold_0/block_splits.csv
  normalization_json: ../../artifacts/cv5/fold_0/normalization.json
  experiments:
  - 1
  lags:
  - 1
  require_clean_history: false
  balance_train_cells: true
  balance_eval_cells: false
  batch_sampling: global
  cache_size: 30
  offline_cache_dir: ../../cache
  time_window_start_s: -0.496
  time_window_end_s: 2.244
  num_workers: 0
  train_cell_weighting: none
  train_cell_weight_max: null
  cv_strategy: block
  normalization_mode: per_subject
model:
  encoder:
    type: window_transformer
    in_channels: auto
    latent_dim: 48
    num_layers: 1
    window_size: 3
    num_heads: 2
    ffn_ratio: 2
    dropout: 0.0
    attention_pattern: centered_local
    position_encoding_mode: sinusoidal_qk
    shift_size: 0
    boundary_mode: noise_pad
    boundary_noise_seed: 42
  time_source_block: null
  time_head_mode: shared
  time_no_class_enabled: true
  attention_mode: gated_scorer
  attention_query_source: subject
  attention_dim: 48
  attention_dropout: 0.1
  attention_gate_init_bias: 2.0
  pool_valid_context_only: false
  classifier_num_layers: 2
  classifier_hidden_dim: 64
  classifier_dropout: 0.1
  subject_conditioning:
    enabled: true
    embedding_dim: 24
    condition_dropout: 0.0
    adaln_dropout: 0.2
    mode: individual
  fusion:
    enabled: false
    hidden_dim: 32
    dropout: 0.3
  reconstruction:
    enabled: false
  attention_score_centering: true
  attention_gate_activation: tanh_plus_one
  attention_gate_combination: multiply
  attention_gate_centering: false
  attention_effective_normalization: none
train:
  iterations: 300000
  validation_interval_iterations: 100
  log_interval_iterations: 100
  batch_size: 256
  learning_rate: 1.0e-05
  lr_schedule: warmup_cosine
  lr_schedule_iterations: 60000
  warmup_iterations: 5000
  min_learning_rate: 5.0e-06
  weight_decay: 0.1
  loss_type: bce_one_vs_rest
  time_loss_type: bce_one_vs_rest
  pooled_loss_type: focal_bce
  fusion_loss_type: bce_one_vs_rest
  time_bce_pos_weight: null
  pooled_bce_pos_weight: null
  label_smoothing: 0.0
  patience_iterations: 30000
  checkpoint_metric: val_pooled_accuracy
  checkpoint_mode: max
  amp: true
  grad_clip_norm: 1.0
  progress_bar: true
  train_time_start_s: -0.496
  train_time_end_s: 2.244
  attention_time_start_s: -0.496
  attention_time_end_s: 2.244
  attention_topk_ratio: 0.8
  attention_topk_k: null
  all_time_head_warmup_iterations: 0
  time_loss_weight: 0.1
  pooled_loss_weight: 1.0
  fusion_loss_weight: 0.0
  invalid_time_loss_weight: 0.0
  invalid_time_loss_scope: all_covered
  attention_mask_penalty_weight: 0.3
  attention_mask_penalty_mode: absolute_effective_mass
  attention_mass_penalty_weight: 0.1
  clean_attention_penalty_weight: 0.0
  attention_smoothness_weight: 0.0
  attention_smoothness_mode: second_difference
  non_topq_time_loss_probability: 0.0
  matched_null_attention_weight: 0.0
  matched_null_noise_mode: sample_channel
  matched_null_min_noise_std: 0.0001
  att_time_consistency_weight: 0.0
  real_noise_margin_weight: 0.0
  reconstruction_loss_weight: 0.0
  temporal_crop_noise:
    enabled: true
    geometry: random_blocks
    probability: 0.8
    min_blocks: 1
    max_blocks: 1
    min_block_duration_s: 0.1
    min_total_duration_s: 0.1
    max_total_duration_s: 1.0
    min_clean_gap_s: 0.03
    allow_edge_blocks: true
    noise_mode: mixture
    min_noise_std: 0.0001
    supervision_mode: all_positions
    noise_mode_probabilities:
      time_shuffle: 0.5
      sample_channel: 0.25
      time_shuffle_independent: 0.25
  pooled_focal_gamma: 1.0
  pooled_focal_alpha: null
  near_full_noise:
    enabled: true
    probability: 0.1
    coverage_ratio: 0.95
    time_loss_scale: 0.25
  augmentation_pipeline:
    enabled: true
    roll_probability: 0.2
    roll_max_shift_s: 1.0
    roll_left_probability: 0.5
plots:
  enabled: true
  splits:
  - val
  gaussian_baseline:
    enabled: true
    seed: 42
    noise_mode: sample_channel
  activation:
    enabled: false
    threshold: 0.5
  event_markers:
    enabled: true
    markers:
    - time_s: 0.0
      label: white-noise onset
      color: '#666666'
      alpha: 0.7
    - time_s: 1.0
      label: tone onset
      color: '#4C78A8'
      alpha: 0.9
    - time_s: 1.25
      label: tone offset / response cue
      color: '#F58518'
      alpha: 0.9
task: pitch
lag: 1
cv_strategy: block
